[package]
name = "basket-weighted-vault"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "basket_weighted_vault"

[features]
custom-heap = []
custom-panic = []
anchor-debug = []
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "xau-carry-vault/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0" }
uint = { version = "0.10", default-features = false }
# Vault 1, used only for its program ID, vXAU seed and state type, so the
# vXAU check can never drift from the real Vault 1 program.
xau-carry-vault = { path = "../xau-carry-vault", features = ["cpi"] }

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3.0"
solana-program-pack = "3.0"
solana-program-option = "3.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
